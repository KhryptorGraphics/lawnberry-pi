<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-label="Steering PWM source selection through one Pololu 2806 multiplexer">
  <title>Steering PWM source selection — CONDITIONAL, NOT INSTALLATION WIRING</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="490" y="24" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="var(--fg)">Steering PWM source selection — one Pololu 2806</text>
  <text x="490" y="44" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="var(--warning)">CONDITIONAL — NOT INSTALLATION WIRING · prototype, physically unvalidated</text>

  <g font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="var(--fg)">
    <rect x="18" y="70" width="210" height="118" rx="8" fill="none" stroke="var(--border)"/>
    <text x="123" y="90" text-anchor="middle" font-weight="600">Raspberry Pi 5</text>
    <text x="123" y="106" text-anchor="middle" font-size="11" fill="var(--muted)">primary · sole motion authority</text>
    <text x="34" y="128">PCA9685 @0x41 · CH0 → M1</text>
    <text x="34" y="146">PCA9685 @0x41 · CH2 → M2</text>
    <text x="34" y="164" fill="var(--muted)">CH1 unused in this model</text>

    <rect x="18" y="212" width="210" height="150" rx="8" fill="none" stroke="var(--border)"/>
    <text x="123" y="232" text-anchor="middle" font-weight="600">Libre Alta</text>
    <text x="123" y="248" text-anchor="middle" font-size="11" fill="var(--muted)">hot standby · shutdown backup</text>
    <text x="34" y="270">CH0 → S1  <tspan fill="var(--warning)">NEUTRAL ONLY</tspan></text>
    <text x="34" y="288">CH2 → S2  <tspan fill="var(--warning)">NEUTRAL ONLY</tspan></text>
    <text x="34" y="308">CH1 → MG995 throttle</text>
    <text x="34" y="328">CH3 → SEL  1000 µs / 2000 µs</text>
    <text x="34" y="348" font-size="11" fill="var(--muted)">only SEL writer · Pi never on SEL</text>

    <rect x="360" y="150" width="240" height="120" rx="8" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <text x="480" y="172" text-anchor="middle" font-weight="600">Pololu 2806</text>
    <text x="480" y="189" text-anchor="middle" font-size="11" fill="var(--muted)">one assembled unit · signal only</text>
    <text x="480" y="208" text-anchor="middle" font-size="11">threshold 1696 µs ±64</text>
    <text x="480" y="224" text-anchor="middle" font-size="11">FAILMODE jumper OFF</text>
    <text x="480" y="240" text-anchor="middle" font-size="11" fill="var(--warning)">no safe-start</text>
    <text x="480" y="258" text-anchor="middle" font-size="11" fill="var(--muted)">3 good pulses · ≈130 ms invalid</text>

    <rect x="700" y="96" width="255" height="70" rx="8" fill="none" stroke="var(--border)"/>
    <text x="827" y="120" text-anchor="middle" font-weight="600">Left steering servo</text>
    <text x="827" y="138" text-anchor="middle" font-size="11" fill="var(--muted)">OUT1 → signal pin only</text>
    <text x="827" y="154" text-anchor="middle" font-size="11" fill="var(--muted)">power: owned converter A</text>

    <rect x="700" y="240" width="255" height="70" rx="8" fill="none" stroke="var(--border)"/>
    <text x="827" y="264" text-anchor="middle" font-weight="600">Right steering servo</text>
    <text x="827" y="282" text-anchor="middle" font-size="11" fill="var(--muted)">OUT2 → signal pin only</text>
    <text x="827" y="298" text-anchor="middle" font-size="11" fill="var(--muted)">power: owned converter B</text>

    <rect x="360" y="330" width="240" height="62" rx="8" fill="none" stroke="var(--border)" stroke-dasharray="5 4"/>
    <text x="480" y="352" text-anchor="middle" font-size="11" font-weight="600">V_MUX_LOGIC</text>
    <text x="480" y="368" text-anchor="middle" font-size="11" fill="var(--muted)">protected low-current branch</text>
    <text x="480" y="383" text-anchor="middle" font-size="11" fill="var(--warning)">independent of BOTH SBCs</text>
  </g>

  <g stroke="currentColor" fill="none" marker-end="url(#arrow)" stroke-width="1.6">
    <path d="M228 128 L358 168"/>
    <path d="M228 146 L358 186"/>
    <path d="M228 270 L358 214"/>
    <path d="M228 288 L358 232"/>
    <path d="M228 328 L358 250"/>
    <path d="M600 180 L698 132"/>
    <path d="M600 236 L698 274"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-dasharray="4 4" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M480 330 L480 272"/>
  </g>
</svg>
