# Hardware watchdog for the Pi 5: a hung kernel reboots instead of sitting on the link.
# Install as /etc/systemd/system.conf.d/10-watchdog.conf (needs `systemctl daemon-reexec`,
# or a reboot, to take effect). The Orange Pi AP uses the same setting (RuntimeWatchdogSec=12).
[Manager]
RuntimeWatchdogSec=20s
RebootWatchdogSec=2min
