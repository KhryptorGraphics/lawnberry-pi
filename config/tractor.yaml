# 50" Toro TimeCutter zero-turn mower actuation config.
#
# The mower's gas engine and hydrostatic transaxles are untouched: two
# high-torque servos physically push/pull the existing twin drive levers.
# Positional actuators (left lever, throttle, right lever) are PCA9685 I2C
# PWM channels (0-indexed). Starter and blade PTO are GPIO relays on the Pi.
# Calibrate the microsecond endpoints on the bench so each actuator hits its
# real mechanical limits before driving the machine.
#
# Set enabled: true on the converted mower.
enabled: false

pca9685:
  # 0x40 is the PCA9685's power-on-reset default, which collides with the
  # INA3221 power monitor already on the bus at 0x40 (spec/hardware.yaml).
  # 0x41 is reached by bridging the board's A0 solder-jumper.
  address: 0x41
  bus: 1
  frequency_hz: 50

actuators:
  # Left drive lever: bidirectional, -1 (full reverse) .. +1 (full forward), detent-centered.
  left_lever:  { channel: 0, us_min: 1000, us_center: 1500, us_max: 2000, bidirectional: true }
  # Engine throttle (RPM lever): 0 (idle) .. 1 (full).
  throttle:    { channel: 1, us_min: 1100, us_max: 1900, bidirectional: false }
  # Right drive lever: bidirectional, -1 (full reverse) .. +1 (full forward), detent-centered.
  right_lever: { channel: 2, us_min: 1000, us_center: 1500, us_max: 2000, bidirectional: true }

relays:
  # Momentary starter solenoid (crank for pulse_ms, then release).
  starter:    { gpio: 5, active_high: true, pulse_ms: 800 }
  # Electric PTO clutch (blade engage/disengage), latching on/off.
  # GPIO 6 (the old default) collides with spec/hardware.yaml's ToF Left
  # Interrupt. Reassigned to GPIO 26, which is not in spec/hardware.yaml's
  # gpio_used list today.
  blade_pto:  { gpio: 26, active_high: true }

# Standard interlocks (ANSI/OPEI-style), adapted for a hydrostatic ZTR with
# no clutch/brake pedal.
interlocks:
  require_levers_neutral_to_start: true  # engine cranks only with both drive levers neutral
  require_blade_off_to_start: true       # ...and the blade/PTO disengaged
  require_engine_running_for_blade: true # PTO engages only with the engine running
  # Reverse Operation System: reverse is defined as BOTH levers pulled back
  # together (a single lever back is a pivot turn) -- no blade in reverse.
  disengage_blade_in_reverse: true

# Command deadman: a lever/throttle command is only in force for a bounded hold.
# Unless it is refreshed, the levers return to neutral and the throttle to idle
# (the blade is NOT touched by the deadman -- it follows the interlocks above and
# the tilt/E-stop latches). Clients must re-send inside the hold: navigation
# sends at 5 Hz and scripts/teleop.py at 20 Hz. A client may ask for a shorter or
# longer hold with `duration_ms`; the service clamps it to max_hold_ms and echoes
# the effective `hold_ms` in the response. Starting values are conservative and
# must be validated on the machine (servo settle time, stopping distance).
command_deadman:
  default_hold_ms: 500   # hold for a command that carries no duration_ms
  max_hold_ms: 2000      # ceiling for any client-requested duration_ms
