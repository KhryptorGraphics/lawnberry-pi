# LawnBerry hardware configuration (example)
# See specs and docs for details. This file declares which hardware modules
# are present. For SIM_MODE: 0, this file may be left minimal.

# Flat form (direct to HardwareConfig) or nested form (compatibility) supported.
# Example nested form used by tests:
#
gps:
  type: LC29H-DA       # Quectel LC29H(DA) HAT via UART at 115200
  uart_device: /dev/ttyAMA0
  baudrate: 115200
imu:
  type: BNO085
sensors:
  tof:
    - left
    - right
  # Optional advanced configuration for ToF sensors (VL53L0X)
  # Uncomment and adjust if your wiring differs from defaults
  tof_config:
    bus: 1            # I2C bus number
    left_address: 0x29
    right_address: 0x30
    ranging_mode: best_accuracy   # options: short|better_accuracy|best_accuracy|long_range|high_speed
    left_shutdown_gpio: 22       # optional XSHUT pin to assign unique address at boot
    right_shutdown_gpio: 23
    timing_budget_us: 200000     # optional: improve accuracy, adjust if needed
power_monitor: true
ina3221:
  # Solar input channel (ch1) uses 30A/75mV shunt => 0.0025 ohm
  shunt_ohms_ch1: 0.0025
  # Battery channel (ch3) uses 50A/75mV shunt => 0.0015 ohm
  shunt_ohms_ch3: 0.0015
victron:
  enabled: true
  # When using BLE, set device_id to the SmartSolar identifier (MAC or name) or leave null to auto-scan
  device_id: "EC:1A:A8:DD:99:C2"  # Replace with your device MAC (leave quoted)
  # Provide either the Instant Readout encryption key (preferred) or a pre-composed
  # '<address>@<key>' device_key string accepted by victron-ble.
  encryption_key: "<replace-with-instant-readout-key>"
  # device_key: "EC:1A:A8:DD:99:C2@<replace-with-instant-readout-key>"
  # Path to victron-ble CLI (must be installed on the system)
  # Absolute venv path: systemd services don't inherit the venv's PATH, so a
  # bare "victron-ble" isn't found even though pip installed it into .venv.
  cli_path: /apps/lawnberry-pi/.venv/bin/victron-ble
  # Optional adapter name/number to pass to victron-ble
  adapter: null
  # Prefer Victron SmartSolar telemetry for these channels when merging with INA3221.
  prefer_battery: true
  prefer_solar: true
  prefer_load: true
motor_controller: robohat-rp2040
blade_controller: ibt-4

# IBT-4 blade driver (differential-drive mower). The real lgpio implementation is armed ONLY by
# gpio_enabled: true. It ships false: the driver is then a flag-only stub and the E-stop reports the
# blade output as "unconfirmed". Nothing here has been run on hardware. Before arming:
#   - GPIO25 (in2) is the HaLow HAT SPI IRQ on the deployed Pi (audit C-03; owner action O-5):
#     the kernel holds the line, so the claim fails until the pin is moved;
#   - the IBT-4 truth table (which input is high for the blade direction, PWM or enable needs) and
#     the pin state at process exit/SIGKILL are unmeasured (on_levels below is a placeholder; exactly
#     one input may be high: both low is OFF, both high is a half-bridge brake state).
# The blade ON is a deadman: the blade stays on for deadman_ms and is driven OFF (confirmed by
# readback) unless the ON command is repeated, so a dead client cannot leave it running.
ibt4:
  gpio_enabled: false
  pins:
    in1: 24
    in2: 25
  on_levels:          # level driven on each input when the blade is ON; OFF drives both low
    in1: 1
    in2: 0
  deadman_ms: 2000    # blade ON lasts this long unless repeated (200..10000)

# Four JSN-SR04T behind a dedicated USB microcontroller (firmware/ultrasonic-mcu/). No Raspberry Pi
# header pin is used. The master switch is ultrasonic_enabled in config/limits.yaml (shipped false).
# Every number here is an UNVALIDATED placeholder until the JSN-SR04T measurements (audit M-40).
# How a reading is judged (jsn_sr04t_driver.py, all on the host; the MCU only reports the echo):
#   CLEAR needs a fresh in-range echo beyond ultrasonic_obstacle_distance_cm, or the owner's flags
#   below; stale, blind-zone, silent, out-of-range, faulted, wrongly sized, impossible (wider than
#   the echo window) and never-heard channels are UNKNOWN. After a NEAR echo (closer than twice the
#   stop distance or the blind-zone line, whichever is larger) silence is the dead zone, not open
#   air: BLIND_ZONE / UNKNOWN for near_hold_s or until a far echo, whatever the flags say.
ultrasonic:
  backend: mcu_usb            # mcu_usb | gpio_hcsr04 (legacy 3x HC-SR04 on Pi pins, DO NOT WIRE)
  port: null                  # TBD (owner): the MCU's *data* serial port (its 2nd CDC interface),
                              # e.g. /dev/serial/by-id/...
                              # NEVER its REPL console or another service's port (the RoboHAT's): the driver
                              # writes nothing until a valid MCU frame has arrived on the port, so a wrong
                              # path is only read (and shows as handshake_timeout), but reading steals bytes
  baudrate: 115200            # ignored by USB CDC
  channels: [outer_left, inner_left, inner_right, outer_right]   # labels only; positions are TBD
  disabled_channels: []       # channels not fitted
  echo_window_ms: 30          # per-sensor echo window after TRIG (TBD, M-40)
  inter_sensor_gap_ms: 30     # quiet time between two sensors firing (TBD, M-40)
  speed_of_sound_mps: 343.2   # 20 degC; no temperature compensation until M-40 justifies it
  min_range_cm: 25.0          # blind zone: closer echoes are UNKNOWN, never clear (TBD, M-40)
  max_range_cm: 400.0         # longest usable echo (TBD, M-40)
  stale_after_ms: 700         # a channel not refreshed for this long is UNKNOWN
  link_timeout_ms: 1500       # no valid frame from the MCU for this long: link down, all UNKNOWN
  handshake_timeout_s: 2.0    # the host speaks only after the MCU's INFO (repeated every 1 s): never below 1.5 s
  alive_window_s: 10.0        # "alive" = a FAR echo pulse this recent (a near echo proves nothing about open air)
  near_hold_s: 30.0           # dead-zone hold after a NEAR echo (5..600): silent = blind zone / unknown for this long
  out_of_range_is_clear: false   # keep false until M-40 shows what a healthy sensor does in open air
  no_echo_is_clear: false        # keep false: a silent line cannot tell open air from a dead or stuck sensor.
                                 # Opt in only after M-40, with alive_window_s near 1 s: a sensor that dies reads
                                 # clear for up to alive_window_s, and never inside near_hold_s of a near echo
  no_echo_requires_alive: true   # with no_echo_is_clear: still need a real echo within alive_window_s

# Camera configuration
camera:
  # Primary camera for navigation (Pi Camera 2 via CSI)
  primary:
    type: picamera2      # picamera2 | opencv | simulated
    width: 1920
    height: 1080
    framerate: 30
  # Stereo camera for depth perception (USB ELP stereo camera)
  stereo:
    enabled: true
    type: usb-stereo     # usb-stereo | simulated
    device_index: 0      # /dev/video0 typically
    width: 2560          # Combined stereo width
    height: 960
    framerate: 30

# Flat alternatives (uncomment to use):
# gps_type: zed-f9p-usb
gps_ntrip_enabled: true   # Set true if RTK corrections are enabled (LC29H-DA or ZED-F9P)
# imu_type: bno085-uart
# tof_sensors: [left, right]
# env_sensor: true
# power_monitor: true
# motor_controller: robohat-rp2040   # Drive via RoboHAT → Cytron MDDRC10 (preferred)
# blade_controller: ibt-4            # Blade via IBT-4 H-Bridge (GPIO24→IN1, GPIO25→IN2)
# camera_enabled: false
