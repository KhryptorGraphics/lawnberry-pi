name: Docs Drift Guard

on:
  pull_request:
    branches: [ main, "**" ]
  push:
    branches: [ main ]

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run docs drift detection
        env:
          # Pull requests: empty, so the script diffs merge-base(origin/<PR base branch>, HEAD)..HEAD.
          # Push to main: the pre-push commit, so the range is the pushed commits. origin/main already
          # equals HEAD there, which would compare nothing (the script refuses that on a push event).
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          bash scripts/check_docs_drift.sh

      - name: Code structure overview follows the changed files
        if: github.event_name == 'pull_request'
        run: python3 scripts/sync_code_structure.py --check --base "origin/${{ github.base_ref }}"
