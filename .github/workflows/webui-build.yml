name: webui-build
on: [pull_request]
concurrency:
  group: webui-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-ui:
    runs-on: ubuntu-latest
    # Use the official Playwright image: Chromium + all system libs are prebaked,
    # so we avoid the slow/flaky `playwright install --with-deps` apt step.
    container:
      image: mcr.microsoft.com/playwright:v1.48.0-jammy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests (vitest)
        # `npm test` is `vitest run` (one pass, no watch). vitest, jsdom and @vue/test-utils are devDependencies, so
        # the `npm ci` above installs them; the image's Node 20 satisfies vitest 2 / vite 5 / jsdom 24 (>= 18). The
        # specs mock the network boundary and the WebSocket, and tests/unit/serverProxy.spec.ts starts
        # frontend/server.mjs on a free loopback port, so no backend or browser is needed. Runs before the build
        # and the e2e specs so a unit failure gates the PR early.
        working-directory: frontend
        run: npm test
        env:
          CI: 'true'
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run e2e tests
        # The e2e specs mock the backend (tests/e2e/utils/mock-backend.ts) and
        # Playwright serves the built frontend itself (webServer: npm run preview).
        working-directory: frontend
        run: npx playwright test
        env:
          CI: 'true'
