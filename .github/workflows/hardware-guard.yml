name: hardware-guard
on: [pull_request]

# GitHub runs a step's `run:` with `bash -e {0}`. `-e` does NOT stop the script for a negated
# command (`! grep ...`) or for any element of an `&&` list except the last, so those forms cannot
# fail a step unless they are the final command. Every check below therefore tests its condition
# explicitly (`if ...; then exit 1; fi`) or is a plain command.
# tests/unit/test_hardware_guard_workflow.py runs these steps against crafted bad manifests.

jobs:
  manifest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Pin-conflict checker self-test and real-repo check (reviewed allow-list)
        run: |
          uv run python scripts/check_hardware_pin_conflicts.py --self-test
          uv run python scripts/check_hardware_pin_conflicts.py

      - name: Pin-conflict, docs-drift-script, guard-workflow and tractor-config tests
        run: |
          SIM_MODE=1 uv run pytest -q \
            tests/unit/test_hardware_pin_conflicts.py \
            tests/unit/test_docs_drift_script.py \
            tests/unit/test_hardware_guard_workflow.py \
            tests/unit/test_tractor_config_file.py

      - name: Ensure required hardware appears in spec/hardware.yaml
        run: |
          f=spec/hardware.yaml
          grep -qi "GPS-RTK-SMA" "$f"
          grep -qi "ZED-\?F9P" "$f" || grep -qi "ZEDF9P" "$f"
          grep -qi "Neo-8M" "$f"
          grep -qi "BNO085" "$f"
          grep -qi "VL53L0X" "$f"
          grep -qi "BME280" "$f"
          grep -qi "SSD1306" "$f"
          grep -qi "INA3221" "$f"
          grep -qi "IBT-4" "$f"
          grep -qi "MDDRC10" "$f"
          grep -qi "RoboHAT" "$f"
          grep -qi "Pi Camera v2" "$f"
          grep -qi "Hailo" "$f"

      - name: Ensure bench-only ethernet note exists
        run: |
          f=spec/hardware.yaml
          grep -qi "ethernet" "$f"
          grep -qi "bench_only" "$f"

      - name: Block irrelevant hardware in manifest
        run: |
          f=spec/hardware.yaml
          for term in "soil" "weather station" "jetson" "movidius"; do
            if grep -qi -- "$term" "$f"; then
              echo "forbidden hardware '$term' appears in $f" >&2
              exit 1
            fi
          done

      - name: Confirm I2C addresses listed (sanity)
        run: |
          grep -qi "0x29" spec/hardware.yaml
          grep -qi "0x30" spec/hardware.yaml
          grep -qi "0x3c" spec/hardware.yaml
          grep -qi "0x40" spec/hardware.yaml
          grep -qi "0x76" spec/hardware.yaml

      # INA3221 mapping: constitution/spec say ch1=Battery, ch3=Solar, but the driver and
      # config/hardware.yaml use ch1=Solar, ch3=Battery. No shunt has been measured, so the
      # evidence is not clear enough to change either side; this step only keeps the spec's
      # documented mapping from silently disappearing or being swapped: the `name:` line that
      # follows `channel_N:` must carry the documented word. Resolve with a bench measurement.
      - name: Verify INA3221 documented channel mapping is present in spec
        run: |
          f=spec/hardware.yaml
          documented() {
            if ! grep -A1 -E "^[[:space:]]*$1:" "$f" | grep -qi "$2"; then
              echo "$f no longer documents $1 = $2" >&2
              exit 1
            fi
          }
          documented channel_1 Battery
          documented channel_2 Unused
          documented channel_3 Solar
