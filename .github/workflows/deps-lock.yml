name: deps-lock
on: [pull_request]
jobs:
  uv-lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v3
      - name: Ensure lockfile present
        run: test -f uv.lock
      - name: Verify lock is up-to-date
        run: uv lock --locked
      # GitHub runs a step's `run:` with `bash -e {0}`, and `-e` does NOT stop the script at a
      # negated command (`! grep ...`): such a line gates only as the very last command. Each ban
      # below therefore tests its pattern explicitly (`if grep ...; then exit 1; fi`).
      # tests/unit/test_workflow_steps.py runs these two steps against crafted pyproject files.
      - name: Ban Windows/x86-only deps
        run: |
          for pattern in 'pywin32|win32|msvc' 'win_amd64|x86_64'; do
            if grep -Ei "($pattern)" pyproject.toml; then
              echo "pyproject.toml matches the banned pattern '$pattern'" >&2
              exit 1
            fi
          done
      - name: Ban Coral pkgs in main env
        run: |
          if grep -Ei '\b(pycoral|edgetpu)\b' pyproject.toml; then
            echo "pycoral/edgetpu must not be in the main environment" >&2
            exit 1
          fi
