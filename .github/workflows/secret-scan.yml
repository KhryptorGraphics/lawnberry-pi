name: secret-scan
# A tripwire for credentials written into files (a sudo password was once committed to a prompt file
# and again to a goal file). It scans the lines a change ADDS, so a leak already in history neither
# hides a new one nor blocks unrelated work. See scripts/check_no_secrets.py.
on:
  pull_request:
  push:
    branches: [main]
# A push is never cancelled and never replaced by a later one: its run scans exactly the commits of
# that push (github.event.before..HEAD), so a cancelled run is a range that nobody scanned. Every
# push gets a group of its own; a pull request run is superseded by the next push to the same pull
# request, which scans the whole range again.
concurrency:
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the lines this pull request adds
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The scanner and its allow-list are the BASE branch's, not the pull request's: a change
          # that loosens a rule, or adds an allow-list entry for its own literal, is judged by the
          # rules it found. (The workflow file itself is the pull request's: .github/CODEOWNERS
          # makes the owner review a change to it, which only binds when branch protection
          # requires code-owner review.) A base that has no scanner yet, the pull request that
          # introduces it, can only be judged by its own.
          mkdir -p scripts spec
          if git cat-file -e "$BASE_SHA:scripts/check_no_secrets.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check_no_secrets.py" > scripts/check_no_secrets.py
            if git cat-file -e "$BASE_SHA:spec/secret_scan_allow.txt" 2>/dev/null; then
              git show "$BASE_SHA:spec/secret_scan_allow.txt" > spec/secret_scan_allow.txt
            else
              rm -f spec/secret_scan_allow.txt
            fi
          else
            echo "::warning::the base branch has no scripts/check_no_secrets.py yet: the scanner of this pull request runs"
          fi
          python3 scripts/check_no_secrets.py --base "$BASE_SHA"
      - name: Scan the lines this push adds
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # A new branch or a force push has no usable "before"; fall back to scanning the tree.
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            python3 scripts/check_no_secrets.py --base "$BEFORE_SHA"
          else
            python3 scripts/check_no_secrets.py --tree
          fi
