name: secret-scan
# A tripwire for credentials written into files (a sudo password was once committed to a prompt file
# and again to a goal file). It scans the lines a change ADDS, so a leak already in history neither
# hides a new one nor blocks unrelated work. See scripts/check_no_secrets.py.
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the lines this pull request adds
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_no_secrets.py --base "$BASE_SHA"
      - name: Scan the lines this push adds
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # A new branch or a force push has no usable "before"; fall back to scanning the tree.
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            python3 scripts/check_no_secrets.py --base "$BEFORE_SHA"
          else
            python3 scripts/check_no_secrets.py --tree
          fi
